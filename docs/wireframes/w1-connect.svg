<text x="112" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">https://homesteadlink.github.io/web-app/</text>
<text x="712" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="start">WebUSB</text>
<text x="1120" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">W1 — Connect</text>
