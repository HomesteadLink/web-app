<g stroke="#0F766E" stroke-width="2" fill="none" stroke-linecap="round"><rect x="283" y="112" width="18" height="8" rx="2" fill="#0F766E" stroke="none"/><line x1="288" y1="112" x2="288" y2="105"/><line x1="296" y1="112" x2="296" y2="105"/><circle cx="288" cy="104" r="1.6" fill="#0F766E" stroke="none"/><circle cx="296" cy="104" r="1.6" fill="#0F766E" stroke="none"/><circle cx="289" cy="116" r="1.3" fill="#fff" stroke="none"/><circle cx="295" cy="116" r="1.3" fill="#fff" stroke="none"/></g>
<text x="312" y="117" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">HomeSteadyLink</text>
<text x="1000" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="end">Step 1 of 5 · Connect</text>
<text x="280" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="start">Connect your router</text>
<text x="280" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Plug the router into this computer with a USB cable, then choose it below.</text>
<rect x="280" y="194" width="720" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<g stroke="#0F766E" stroke-width="2" fill="none" stroke-linecap="round"><rect x="312" y="226" width="8" height="12" rx="2"/><line x1="314" y1="226" x2="314" y2="220"/><line x1="318" y1="226" x2="318" y2="220"/><circle cx="314" cy="219" r="1.4" fill="#0F766E" stroke="none"/><circle cx="318" cy="219" r="1.4" fill="#0F766E" stroke="none"/></g>
<text x="344" y="230" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">Your router is a USB device</text>
<text x="344" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">The page talks to it over USB — no Bluetooth, no Wi-Fi needed for setup.</text>
<text x="344" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">The router shows up as “HomeSteadyLink” in the browser's device list.</text>
<rect x="304" y="294" width="220" height="34" rx="17" fill="#EFF6F6" stroke="#0F766E" stroke-width="1"/>
<text x="414" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0F766E" text-anchor="middle">✓  USB cable connected</text>
<rect x="280" y="360" width="260" height="52" rx="24" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="410.0" y="391.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Connect router</text>
<text x="280" y="437" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Opens the browser's device picker. Pick “HomeSteadyLink” → Pair.</text>
<rect x="280" y="450" width="720" height="96" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="304" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">Which browsers work</text>
<text x="304" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Chrome and Edge on macOS, Windows, and Linux. Android Chrome works with a USB cable.</text>
<text x="304" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Safari can't use USB — use the router's Wi-Fi setup page instead (see below).</text>
<text x="280" y="572" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#6B7280" text-anchor="start">No USB? Open the router's Wi-Fi setup page: join the “HomeSteady-…” network, then open</text>
<text x="280" y="590" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="start">http://192.168.65.1:8080</text>
</svg>