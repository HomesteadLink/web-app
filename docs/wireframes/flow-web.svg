<text x="112" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" fill="#111827" text-anchor="start">https://homesteadlink.github.io/web-app/</text>
<text x="712" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F766E" text-anchor="start">WebUSB</text>
<text x="1120" y="18" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="end">W-flow — Web app flow</text>
<rect x="0" y="76" width="1280" height="724" fill="#F9FAFB"/>
<text x="280" y="122" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="start">Web app flow</text>
<text x="280" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Connect over USB → Pair → Wi-Fi → VPN → Progress → Device. One decision per step.</text>
<rect x="280" y="174" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W1 · Connect</text>
<text x="292" y="213" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">pick the router over USB</text>
<line x1="380.0" y1="226" x2="380.0" y2="250" stroke="#0F766E" stroke-width="2"/>
<path d="M375.0 244 L380.0 250 L385.0 244" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="250" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="271" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W2 · Pair</text>
<text x="292" y="289" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">6-digit setup code</text>
<line x1="380.0" y1="302" x2="380.0" y2="326" stroke="#0F766E" stroke-width="2"/>
<path d="M375.0 320 L380.0 326 L385.0 320" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="326" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W3 · Wi-Fi</text>
<text x="292" y="365" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">networks near the router</text>
<line x1="380.0" y1="378" x2="380.0" y2="402" stroke="#0F766E" stroke-width="2"/>
<path d="M375.0 396 L380.0 402 L385.0 396" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="402" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W4 · VPN</text>
<text x="292" y="441" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">WireGuard / Tailscale / Skip</text>
<line x1="380.0" y1="454" x2="380.0" y2="478" stroke="#0F766E" stroke-width="2"/>
<path d="M375.0 472 L380.0 478 L385.0 472" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="478" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="499" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W5 · Progress</text>
<text x="292" y="517" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">live provisioning</text>
<line x1="380.0" y1="530" x2="380.0" y2="554" stroke="#0F766E" stroke-width="2"/>
<path d="M375.0 548 L380.0 554 L385.0 548" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="554" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/>
<text x="292" y="575" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#111827" text-anchor="start">W6 · Device</text>
<text x="292" y="593" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start">steady-state control</text>
<rect x="530" y="178" width="470" height="44" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">No device / permission denied → back to Connect</text>
<line x1="480" y1="200.0" x2="530" y2="200.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 196.0 L530 200.0 L524 204.0" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="254" width="470" height="44" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">Wrong code / lockout → try again on Pair</text>
<line x1="480" y1="276.0" x2="530" y2="276.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 272.0 L530 276.0 L524 280.0" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="330" width="470" height="44" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">No networks found → scan again on Wi-Fi</text>
<line x1="480" y1="352.0" x2="530" y2="352.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 348.0 L530 352.0 L524 356.0" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="472" width="470" height="64" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">Wi-Fi auth failed → back to Wi-Fi</text>
<text x="542" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">Captive portal → portal pass → re-check</text>
<line x1="480" y1="504.0" x2="530" y2="504.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 500.0 L530 504.0 L524 508.0" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="546" width="470" height="46" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">VPN failed → Retry VPN / continue without VPN</text>
<line x1="480" y1="504.0" x2="505" y2="504.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="505" y1="504.0" x2="505" y2="569" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="505" y1="569" x2="530" y2="569" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 565 L530 569 L524 573" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="604" width="470" height="46" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
<text x="542" y="624" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#111827" text-anchor="start">Factory Reset / Disconnect → Connect</text>
<line x1="480" y1="580.0" x2="505" y2="580.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="505" y1="580.0" x2="505" y2="627" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="505" y1="627" x2="530" y2="627" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M524 623 L530 627 L524 631" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="280" y1="680" x2="1000" y2="680" stroke="#E5E7EB" stroke-width="1"/>
<text x="280" y="704" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Browser picker: the device list is the browser's own dialog — the page cannot draw it.</text>
<text x="280" y="724" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Back button: browser back returns to the previous step; Disconnect returns to Connect.</text>
<text x="280" y="744" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">The page remembers the paired device for this browser session only — closing the tab disconnects.</text>
</svg>