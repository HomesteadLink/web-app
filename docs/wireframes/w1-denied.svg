<g stroke="#0F766E" stroke-width="2" fill="none" stroke-linecap="round"><rect x="283" y="112" width="18" height="8" rx="2" fill="#0F766E" stroke="none"/><line x1="288" y1="112" x2="288" y2="105"/><line x1="296" y1="112" x2="296" y2="105"/><circle cx="288" cy="104" r="1.6" fill="#0F766E" stroke="none"/><circle cx="296" cy="104" r="1.6" fill="#0F766E" stroke="none"/><circle cx="289" cy="116" r="1.3" fill="#fff" stroke="none"/><circle cx="295" cy="116" r="1.3" fill="#fff" stroke="none"/></g>
<text x="312" y="117" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111827" text-anchor="start">HomeSteadyLink</text>
<text x="1000" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="end">Step 1 of 5 · Connect</text>
<text x="280" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#111827" text-anchor="start">Connect your router</text>
<text x="280" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Plug the router into this computer with a USB cable, then choose it below.</text>
<rect x="280" y="194" width="720" height="210" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<g><circle cx="316" cy="228" r="10" fill="#DC2626"/><path d="M316 223 V229" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="316" cy="233" r="1.4" fill="#fff"/></g>
<text x="344" y="230" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#111827" text-anchor="start">No router found</text>
<text x="344" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">The browser couldn't access the router over USB.</text>
<line x1="304" y1="272" x2="976" y2="272" stroke="#E5E7EB" stroke-width="1"/>
<text x="304" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#111827" text-anchor="start">Check this</text>
<text x="304" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">• The USB cable is plugged into the router and this computer.</text>
<text x="304" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">• You picked “HomeSteadyLink” in the device list — cancelling returns here.</text>
<text x="304" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">• The browser has USB permission (lock icon → Site settings → USB).</text>
<rect x="304" y="372" width="300" height="24" rx="6" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<text x="454" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#111827" text-anchor="middle">Copy error details</text>
<rect x="280" y="420" width="260" height="52" rx="24" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="410.0" y="451.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Try again</text>
<text x="280" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Full error (technical detail) lives behind “Copy error details”: the USB error name</text>
<text x="280" y="513" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">and the browser's reason, copied as one block for a bug report.</text>
</svg>