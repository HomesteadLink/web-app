<text x="316" y="507" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="start">Exit node (optional) — e.g. mullvad-us12</text>
<text x="280" y="543" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Generate a key in your Tailscale admin console under Settings → Keys.</text>
<rect x="280" y="552" width="260" height="52" rx="24" fill="#0F766E" stroke="#0F766E" stroke-width="1"/>
<text x="410.0" y="583.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Save &amp; provision</text>
<rect x="280" y="614" width="280" height="46" rx="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
<text x="420.0" y="642.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Skip VPN (Wi-Fi only)</text>
<text x="280" y="681" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">Save sends Wi-Fi + VPN together → Progress. Skip sends Wi-Fi only.</text>
<text x="280" y="697" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">WireGuard or Tailscale — pick one. The other card stays empty.</text>
